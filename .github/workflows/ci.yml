name: Build

# Runs on every push to main and on pull requests — catches broken builds
# before they reach Vercel. The app builds fine without Supabase env vars
# (it falls back to demo mode), so no secrets are needed here.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
